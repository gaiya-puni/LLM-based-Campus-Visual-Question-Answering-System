<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="./ecnu_logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#c20a1c" />
  <meta name="description"
    content="华东师范大学校园可视可答系统：用自然语言提问校园建筑、食堂、停车、水景与植物，答案直接在地图上标注；并提供场景热图、一日行程规划与校园资产生成能力。" />
  <title>ECNU·校园可视可答系统</title>
  <!-- PWA -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <!-- iOS：Safari 添加到主屏幕后全屏运行（PWA 兜底方案，免 Apple 开发者账号） -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="校园可视可答" />
  <link rel="apple-touch-icon" href="./icons/pwa-180.png" />
  <script>
    window._AMapSecurityConfig = { securityJsCode: '%VITE_AMAP_SECURITY_CODE%' };
  </script>
  <script async
    src="https://webapi.amap.com/maps?v=2.0&key=%VITE_AMAP_KEY%&plugin=AMap.MarkerCluster,AMap.Walking"></script>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
  <!-- Service Worker 注册：静态资源缓存兜底，/api/ 永不缓存。
       本地开发（localhost / 127.0.0.1）不注册，避免缓存干扰热更新与调试。 -->
  <script>
    (function () {
      var isLocalDev = ['localhost', '127.0.0.1', '0.0.0.0'].indexOf(location.hostname) !== -1;
      if (!('serviceWorker' in navigator) || isLocalDev) return;
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function (err) {
          console.error('Service Worker 注册失败：', err);
        });
      });
    })();
  </script>
</body>

</html>
